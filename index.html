<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100..900&display=swap" rel="stylesheet">
    <script type="module" src="./src/scripts/index.js"></script>
    <link rel="stylesheet" href="./src/styles/index.css">
    <title>WeatherApp</title>

</head>
<body>
<div class="app-background"></div>
<div class="weather-app">
    <header class="weather-app__header">
        <h1>
            <a class="weather-app__logo" href="index.html">
                <img alt="логотип приложения WeatherApp" src="src/assets/logo/logo.svg" width="192" height="48"></a>
        </h1>
        <div class="weather-app__search">
            <input type="text"
                   aria-label="search"
                   autocomplete="on"
                   name="header__search"
                   placeholder="Поиск по городу"
                   class="weather-app__search-input"/>
            <button type="button" class="weather-app__search-button weather-app__search-button--search"></button>
        </div>
    </header>
    <main class="weather-app__main">
        <section class="weather-app__block">
            <div class="weather-app__current"></div>
            <div class="weather-app__forecast"></div>
        </section>
        <section class="weather-app__slider"></section>
    </main>
    <footer class="footer">
        <div class="footer__container">
            <p class="footer__text">
                Проект выполнен в рамках стажировки
                <a class="footer__link" href="https://preax.ru" target="_blank" rel="noopener noreferrer">PREAX</a>
            </p>
        </div>
    </footer>
</div>
</body>
</html>
